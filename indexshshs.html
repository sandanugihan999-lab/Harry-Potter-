<!-- CINE FACTS LK — Black background + top-left logo + video with blue play button
     Paste the <style> block into your site's <head>, and paste the two
     <div> blocks (header + video card) into your page's <body> where you
     want them to appear. -->

<style>
  html, body {
    background: #000 !important;
    margin: 0;
    min-height: 100%;
  }

  .cf-header {
    display: flex;
    align-items: center;
    padding: 14px 20px;
  }

  .cf-header img {
    height: 56px;
    width: 56px;
    border-radius: 50%;
  }

  .cf-video-card {
    position: relative;
    max-width: 480px;
    aspect-ratio: 16 / 9;
    margin: 30px auto;
    border-radius: 12px;
    overflow: hidden;
    background: #000;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    cursor: pointer;
  }

  .cf-video-card iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: none;
  }

  .cf-video-card.cf-playing iframe {
    display: block;
  }

  .cf-video-card.cf-playing .cf-play-overlay {
    display: none;
  }

  .cf-thumb {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #000;
  }

  .cf-play-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .cf-play-btn {
    width: 74px;
    height: 74px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #4fa8ff, #0057ff 70%);
    box-shadow: 0 0 0 6px rgba(0,110,255,0.18), 0 0 24px rgba(0,110,255,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .cf-video-card:hover .cf-play-btn {
    transform: scale(1.08);
    box-shadow: 0 0 0 9px rgba(0,110,255,0.22), 0 0 34px rgba(0,110,255,0.9);
  }

  .cf-play-btn svg {
    width: 26px;
    height: 26px;
    fill: #fff;
    margin-left: 4px;
  }
</style>
